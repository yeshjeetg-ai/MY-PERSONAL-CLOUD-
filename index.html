<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Cloud</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    padding: 25px;
    background: #192438;
    text-align: center;
}

header h1 {
    color: #60a5fa;
}

.container {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    font-size: 16px;
}

footer {
    text-align: center;
    color: #94a3b8;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>☁️ MY PERSONAL CLOUD</h1>
    <p>Your Personal Online Storage</p>
</header>

<div class="container">

    <div class="card">
        <h2>Welcome to Your Cloud</h2>
        <p>Your personal storage space is being prepared.</p>
        <button>Get Started</button>
    </div>

    <div class="card">
        <h3>📸 Photos</h3>
        <p>Your photos will appear here.</p>
    </div>

    <div class="card">
        <h3>🎬 Videos</h3>
        <p>Your videos will appear here.</p>
    </div>

    <div class="card">
        <h3>📁 Documents</h3>
        <p>Your documents will appear here.</p>
    </div>

</div>

<footer>
    MY PERSONAL CLOUD © 2026
</footer>

</body>
</html>
